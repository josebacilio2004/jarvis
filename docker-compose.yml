version: '3.8'

services:
  db:
    image: ankane/pgvector:latest # PostgreSQL con soporte para vectores de IA
    container_name: bot_database
    restart: always
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
